name: Deploy KEBackend

on:
  push:
    branches:
      - test
      - main

  pull_request:
    branches:
      - test
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Build backend
        run: ./gradlew clean build -x test

      - name: Deploy backend to TEST
        if: github.event_name == 'push' && github.ref == 'refs/heads/test'
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*plain.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No executable Spring Boot JAR found"
            echo "Available files:"
            ls -lh build/libs
            exit 1
          fi

          sudo mkdir -p /opt/keonline/test/backend
          sudo rm -rf /opt/keonline/test/backend/app.jar
          sudo cp "$JAR_FILE" /opt/keonline/test/backend/app.jar
          sudo chown harsh:harsh /opt/keonline/test/backend/app.jar

          sudo systemctl restart kebackend-test.service
          sudo systemctl status kebackend-test.service --no-pager

      - name: Deploy backend to PROD
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*plain.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No executable Spring Boot JAR found"
            echo "Available files:"
            ls -lh build/libs
            exit 1
          fi

          sudo mkdir -p /opt/keonline/prod/backend
          sudo rm -rf /opt/keonline/prod/backend/app.jar
          sudo cp "$JAR_FILE" /opt/keonline/prod/backend/app.jar
          sudo chown harsh:harsh /opt/keonline/prod/backend/app.jar

          sudo systemctl restart kebackend-prod.service
          sudo systemctl status kebackend-prod.service --no-pager

      - name: Verify PROD backend port
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Checking prod backend on port 9001..."
          sleep 8
          sudo systemctl status kebackend-prod.service --no-pager
          sudo ss -ltnp | grep ':9001'

      - name: Verify TEST backend port
        if: github.event_name == 'push' && github.ref == 'refs/heads/test'
        run: |
          echo "Checking test backend on port 9002..."
          sleep 8
          sudo systemctl status kebackend-test.service --no-pager
          sudo ss -ltnp | grep ':9002'
