spring.application.name=ticketSystemKE

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

ke.workflow.repair.enabled=true

server.address=127.0.0.1
server.port=9001

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging configuration Log4j2
logging.file.name=/home/harsh/apps/logs/application.log
logging.level.root=INFO
logging.level.com.ke=INFO

speech.transcription.enabled=${SPEECH_TRANSCRIPTION_ENABLED:false}
speech.transcription.provider-priority=${SPEECH_TRANSCRIPTION_PROVIDER_PRIORITY:GOOGLE_STT,OPENAI_STT,AZURE_STT}
speech.transcription.default-language-code=${SPEECH_TRANSCRIPTION_DEFAULT_LANGUAGE_CODE:hi-IN}
speech.transcription.max-audio-seconds=${SPEECH_TRANSCRIPTION_MAX_AUDIO_SECONDS:15}
speech.transcription.max-audio-bytes=${SPEECH_TRANSCRIPTION_MAX_AUDIO_BYTES:5242880}
speech.transcription.google.enabled=${GOOGLE_STT_ENABLED:false}
speech.transcription.google.monthly-limit-seconds=${GOOGLE_STT_MONTHLY_LIMIT_SECONDS:3600}
speech.transcription.google.language-code=${GOOGLE_STT_LANGUAGE_CODE:hi-IN}
speech.transcription.google.application-credentials=${GOOGLE_APPLICATION_CREDENTIALS:}
speech.transcription.openai.enabled=${OPENAI_STT_ENABLED:false}
speech.transcription.openai.monthly-limit-seconds=${OPENAI_STT_MONTHLY_LIMIT_SECONDS:3600}
speech.transcription.openai.api-key=${OPENAI_STT_API_KEY:}
speech.transcription.azure.enabled=${AZURE_STT_ENABLED:false}
speech.transcription.azure.monthly-limit-seconds=${AZURE_STT_MONTHLY_LIMIT_SECONDS:3600}
speech.transcription.azure.key=${AZURE_STT_KEY:}
speech.transcription.azure.region=${AZURE_STT_REGION:}
